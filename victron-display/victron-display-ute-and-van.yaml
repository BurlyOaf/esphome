script:
  - id: update_all_components
    then:
      - component.update: shunt_1_TIME_TO_GO_text
      - component.update: shunt_1_STATE_OF_CHARGE_symbol
      - component.update: shunt_2_TIME_TO_GO_text
      - component.update: shunt_2_STATE_OF_CHARGE_symbol
########### GITHUB HELP - Stale values
#script:
  - id: victron_present_reset
    then:
      - delay: 60s
      - globals.set:
          id: victron_present
          value: 'false'

display:
  - platform: st7789v
    model: TTGO TDisplay 135x240
    backlight_pin: GPIO4
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    update_interval: 2s
    #invert_colors: false
    data_rate: 80MHz
    rotation: 0
    lambda: |-
      #define xres 240
      #define yres 135
      #define x_pad 10  // border padding was 25
      #define y_pad 8   // border padding was 5? i think... check reference yaml
      #define first_pad 15 // was 38
      #define cat_pad 25       // padding before category, was 45
      #define icon_pad 22      // padding after icons, was 22
      #define neg_icon_pad 17  // small padding after icons for negative numbers
      #define x1i x_pad        // x position of first column of values

      id(update_all_components).execute();

      u_int16_t y = first_pad;

      if (id(victron_page)) {
        // Page 1 (using first Smart Shunt and Smart Solar)

        // shunt_1_BATTERY_VOLTAGE
        y += cat_pad;
        it.printf(x1i, y, id(font_icons_small), TextAlign::BASELINE_CENTER, id(shunt_1_STATE_OF_CHARGE_symbol).state.c_str());
        if (!std::isnan(id(shunt_1_BATTERY_VOLTAGE).state) && id(victron_present)) {
          it.printf(x1i + icon_pad, y, id(font_value), TextAlign::BASELINE_LEFT, "%.2f V", id(shunt_1_BATTERY_VOLTAGE).state);
        }
  
  
  
        // shunt_1_STATE_OF_CHARGE
        y += cat_pad;
        it.printf(x1i, y, id(font_icons_small), TextAlign::BASELINE_CENTER, id(shunt_1_STATE_OF_CHARGE_symbol).state.c_str());
        if (!std::isnan(id(shunt_1_STATE_OF_CHARGE).state) && id(victron_present)) {
          if (id(shunt_1_STATE_OF_CHARGE).state == 100.0f) {
            it.printf(x1i + icon_pad, y, id(font_value), TextAlign::BASELINE_LEFT, "100 %%");
          } else {
            it.printf(x1i + icon_pad, y, id(font_value), TextAlign::BASELINE_LEFT, "%.1f %%", id(shunt_1_STATE_OF_CHARGE).state);
          }
        }
  
        // Battery time remaining
        y += cat_pad;
        it.printf(x1i, y, id(font_icons_small), TextAlign::BASELINE_CENTER, "\U000F051F");  // mdi-timer-sand
        if (!std::isnan(id(shunt_1_TIME_TO_GO).state) && id(victron_present)) {
          it.printf(x1i + icon_pad, y, id(font_value), TextAlign::BASELINE_LEFT, id(shunt_1_TIME_TO_GO_text).state.c_str());
        }
  
        // Consumed Ah
        y += cat_pad;
        it.printf(x1i, y, id(font_icons_small), TextAlign::BASELINE_CENTER, "\U000F140B");  // mdi-lightning-bolt
        const auto CONSUMED_AH = id(shunt_1_CONSUMED_AH).state;
        if (!std::isnan(CONSUMED_AH) && id(victron_present)) {
          if (std::abs(CONSUMED_AH) >= 10.0f) {
            it.printf(x1i + neg_icon_pad, y, id(font_value), TextAlign::BASELINE_LEFT, "%.0f Ah", CONSUMED_AH);
          } else {
            it.printf(x1i + neg_icon_pad, y, id(font_value), TextAlign::BASELINE_LEFT, "%.1f Ah", CONSUMED_AH);
          }
        }
  
        // Battery Current
        y += cat_pad;
