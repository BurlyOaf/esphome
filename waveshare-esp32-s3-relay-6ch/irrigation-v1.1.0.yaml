switch:
  - platform: gpio
    pin: GPIO46
    id: relay6
    name: ${relay_zone_1}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 25minutes
      - switch.turn_off: relay6
  - platform: gpio
    pin: GPIO45
    id: relay5
    name: ${relay_zone_2}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 25minutes
      - switch.turn_off: relay5
  - platform: gpio
    pin: GPIO42
    id: relay4
    name: ${relay_zone_3}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 25minutes
      - switch.turn_off: relay4
  - platform: gpio
    pin: GPIO41
    id: relay3
    name: ${relay_zone_4}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 25minutes
      - switch.turn_off: relay3
  - platform: gpio
    pin:
      number: GPIO2
#      ignore_strapping_warning: true
    id: relay2
    name: ${relay_zone_5}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 25minutes
      - switch.turn_off: relay2
  - platform: gpio
    pin:
      number: GPIO1
#      ignore_strapping_warning: true
    id: relay1
    name: ${relay_master_solenoid}
    restore_mode: ALWAYS_OFF

