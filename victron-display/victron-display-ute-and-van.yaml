logger:
  baud_rate: 2000000

esp32_ble_tracker:
  scan_parameters:
    interval: 160ms
    window: 80ms
    active: false

victron_ble:
  - id: MySmartShunt_1
    mac_address: ${smart_shunt_1_mac_address}
    bindkey: ${smart_shunt_1_encryption_key}
########### GITHUB HELP - Stale values
    on_message:
      then:
        - lambda: |-
            id(victron_present) = true;
            id(victron_present_reset).stop();
            id(victron_present_reset).execute();
  - id: MySmartSolar_1
    mac_address: ${smart_solar_1_mac_address}
    bindkey: ${smart_solar_1_encryption_key}
########### GITHUB HELP - Stale values
    on_message:
      then:
        - lambda: |-
            id(victron_present) = true;
            id(victron_present_reset).stop();
            id(victron_present_reset).execute();
  - id: MySmartShunt_2
    mac_address: ${smart_shunt_2_mac_address}
    bindkey: ${smart_shunt_2_encryption_key}
########### GITHUB HELP - Stale values
    on_message:
      then:
        - lambda: |-
            id(victron_present) = true;
            id(victron_present_reset).stop();
            id(victron_present_reset).execute();
  - id: MySmartSolar_2
    mac_address: ${smart_solar_2_mac_address}
    bindkey: ${smart_solar_2_encryption_key}
########### GITHUB HELP - Stale values
    on_message:
      then:
        - lambda: |-
            id(victron_present) = true;
            id(victron_present_reset).stop();
            id(victron_present_reset).execute();

globals:
  - id: victron_present
    type: bool
    restore_value: false
    initial_value: 'false'
# Global variable to track the current page
#globals:
  - id: victron_page
    type: bool
    restore_value: true
    initial_value: 'true' 

binary_sensor:
  - platform: gpio
    pin: GPIO35
    name: "Page Toggle Button"
    on_press:
      then:
        - lambda: |-
            id(victron_page) = !id(victron_page);  // Toggle between page 1 and page 2


